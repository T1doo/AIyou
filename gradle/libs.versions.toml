[versions]
# Retain the frozen toolchain; upgrading AGP requires separate compatibility/license review.
# Suppress only latest-release advice for this exact pin, not source/API/security lint.
#noinspection AndroidGradlePluginVersion
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
junit = "4.13.2"
# Keep the reviewed screenshot plugin and validation API on the same frozen version.
# Suppress only newer-release advice for this pin; compatibility and checksum checks remain.
#noinspection GradleDependency
screenshot = "0.0.1-alpha16"
room = "2.8.5"
ksp = "2.3.12"
# D02 pins the reviewed 4.19.1 candidate; runtime acceptance stays separate.
# Upgrading requires renewed native/license evidence; suppress only release-availability advice for this pin.
#noinspection NewerVersionAvailable
sqlcipher = "4.19.1"
#noinspection GradleDependency
sqlite = "2.7.0"
#noinspection NewerVersionAvailable
coroutines = "1.9.0"
# D04 retains the reviewed Json-tree runtime pin; upgrades need separate compatibility review.
# Suppress only newer-release advice for this version; other lint checks remain enabled.
#noinspection NewerVersionAvailable
serialization = "1.9.0"
okhttp = "5.5.1"
#noinspection GradleDependency
lifecycle = "2.9.4"
android-test-runner = "1.7.0"
android-test-junit = "1.3.0"
robolectric = "4.17"
# Official Robolectric 4.17 DefaultSdkProvider: API35, Java17, preinstrumented i7.
robolectric-sdk = "15-robolectric-13954326-i7"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
junit = { module = "junit:junit", version.ref = "junit" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric-runtime = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-sdk = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-sdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
