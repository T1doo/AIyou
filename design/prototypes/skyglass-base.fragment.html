<style>
#ay-journal{padding:22px 0 32px;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:light dark}
#ay-journal *{box-sizing:border-box}#ay-journal .phone{--paper:light-dark(#faf9f5,#202723);--surface:light-dark(#fffefa,#29322d);--ink:light-dark(#253a31,#edf1e9);--muted:light-dark(#737c73,#adb8ac);--line:light-dark(#e5e8dd,#3c4940);--wash:light-dark(#eef1e8,#35443a);--accent:#42634d;max-width:390px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 48px #17271c16;position:relative;font-size:14px;line-height:1.65;min-height:810px}

#ay-journal .search{display:flex;align-items:center;gap:10px;background:var(--wash);border-radius:7px;padding:9px 12px;margin:20px 0 8px}#ay-journal .search input{min-width:0;width:100%;font-size:14px;outline:none;border:0;background:none;padding:2px}#ay-journal .search input::placeholder{color:var(--muted)}#ay-journal .filterline{display:flex;align-items:center;justify-content:space-between;margin:0 -7px 15px;font-size:12px}#ay-journal .filterline button{min-width:0;padding:8px 7px;color:var(--muted)}#ay-journal .filterline button.selected{color:var(--accent);font-weight:600}#ay-journal .memory[hidden]{display:none}#ay-journal .memory{padding:17px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}#ay-journal .memory .date{font-family:Georgia,serif;width:28px;flex-shrink:0;font-size:24px;line-height:1.1;color:var(--muted)}#ay-journal .memory .date small{font:9px "Segoe UI",sans-serif;display:block;margin-top:5px}#ay-journal .memory .copy{flex:1}#ay-journal .memory h2{font-size:14px;margin-bottom:6px}#ay-journal .memory p{font-size:12px;color:var(--muted)}#ay-journal .memory .meta{font-size:10px;margin-top:10px;color:var(--muted)}#ay-journal .month{font:12px Georgia,serif;letter-spacing:1px;margin-top:26px;color:var(--accent)}#ay-journal .quiet-link{display:flex;gap:7px;align-items:center;margin-top:18px;font-size:12px;color:var(--accent)}
#ay-journal .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:24px 0 25px}#ay-journal .day{padding:7px 0;text-align:center;border-radius:6px;font-size:15px}#ay-journal .day small{display:block;font-size:10px;margin-bottom:7px;color:var(--muted)}#ay-journal .day.current{background:var(--accent);color:#fff}#ay-journal .day.current small{color:#e4eadf}#ay-journal .task{display:flex;align-items:flex-start;gap:12px;padding:17px 0;border-bottom:1px solid var(--line);transition:opacity .2s}#ay-journal .task .check{padding:0;min-height:24px;min-width:24px;margin-top:2px;border:1px solid #a5b09f;border-radius:6px;display:grid;place-items:center}#ay-journal .task .check svg{opacity:0;width:15px;height:15px}#ay-journal .task.done .check{background:var(--accent);border-color:var(--accent);color:#fff}#ay-journal .task.done .check svg{opacity:1;animation:ay-check .18s ease-out}@keyframes ay-check{from{transform:scale(.6)}to{transform:scale(1)}}#ay-journal .task.done .title{text-decoration:line-through;color:var(--muted)}#ay-journal .task .title{font-size:14px}#ay-journal .task .soft{font-size:11px;margin-top:5px}#ay-journal .task .tail{margin-left:auto;color:var(--muted);font-size:11px}#ay-journal .suggestion{padding:13px 14px;margin-top:24px;border-radius:8px;background:var(--wash);display:flex;justify-content:space-between;align-items:center;font-size:12px}#ay-journal .add-task{margin-top:17px;color:var(--accent);display:flex;align-items:center;gap:8px;font-size:13px}
#ay-journal .shade{position:absolute;inset:0;background:#15241d33;z-index:4;opacity:0;pointer-events:none;transition:opacity .2s}#ay-journal .shade.open{opacity:1;pointer-events:auto}#ay-journal .sheet{position:absolute;bottom:0;left:0;width:100%;background:var(--surface);border-radius:18px 18px 0 0;z-index:5;padding:10px 24px 30px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow:auto}#ay-journal .sheet.open{transform:none}#ay-journal .handle{width:28px;height:3px;background:var(--line);border-radius:4px;margin:0 auto 15px}#ay-journal .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}#ay-journal .sheethead h2{font-size:18px}#ay-journal .solid{background:var(--accent);color:#fff;padding:5px 17px;min-height:34px;border-radius:6px;font-size:12px}#ay-journal textarea{display:block;width:100%;min-height:230px;border:0;resize:vertical;background:none;font-size:16px;line-height:1.9;outline:none}#ay-journal .sheet .options{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#ay-journal .options button{background:var(--wash);padding:8px 12px;font-size:12px}#ay-journal .detail-body{font-size:15px;line-height:2.1;margin-top:20px}#ay-journal .settings-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:13px}#ay-journal .settings-row span{color:var(--muted);font-size:11px}#ay-journal .toast{position:absolute;bottom:99px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--paper);padding:9px 17px;border-radius:7px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:7;white-space:nowrap}#ay-journal .toast.show{opacity:1;transform:translate(-50%,0)}#ay-journal .small-note{text-align:center;color:light-dark(#70776f,#afb7ad);font-size:11px;margin:12px 0 0;letter-spacing:.3px}
#ay-journal .phone.reduce *,#ay-journal .phone.reduce *:before{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){#ay-journal *{animation:none!important;transition:none!important}}@media(max-width:380px){#ay-journal .content{padding:16px 20px}#ay-journal .phone{border-radius:15px}#ay-journal .brand small{display:none}}
</style>

 <div class="status"><span>9:41</span><span class="signals"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
 <header><div class="brand">爱忆<small>AIYOU</small></div><div class="head-actions"><button data-action="companion" aria-label="陪伴"><i class="icon" data-lucide="sprout"></i></button><button data-action="settings" aria-label="设置"><i class="icon" data-lucide="settings-2"></i></button></div></header>

<script>
(()=>{const root=document.getElementById('ay-journal'),phone=root.querySelector('.phone'),main=root.querySelector('main'),sheet=root.querySelector('.sheet'),shade=root.querySelector('.shade');let page='now',lastFocus=null,playing=false,tick=null,seconds=0;const state={draft:'',added:[],done:false,accent:'#42634d',reduce:false};const icon=(n)=>`<i class="icon" data-lucide="${n}" aria-hidden="true"></i>`;const safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{'stroke-width':1.65}})}function toast(t){let el=root.querySelector('.toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function wave(){return Array.from({length:30},(_,i)=>`<b style="height:${[5,11,18,9,22,14,6,17,12,20][i%10]}px"></b>`).join('')}function audio(){return `<div class="audio-row"><button data-action="play" aria-label="演示播放状态">${icon('play')}</button><div class="wave" aria-hidden="true">${wave()}</div><span class="time">0:00 / 0:12</span></div>`}function intro(title,sub,eye){return `<div class="intro"><div class="eyebrow">${eye}</div><h1>${title}</h1><p class="soft">${sub}</p>${icon('leaf').replace('class="icon"','class="sprig"')}</div>`}
function render(){stop();main.innerHTML=page==='now'?`${intro('把今天，慢慢记好。','小小的日常，也值得被珍藏。','11 月 04 日　星期三')}<div class="section-line"><h2>今天的片刻</h2><span>${2+state.added.length} 条记录</span></div>${state.added.map(t=>`<article class="entry"><time>刚刚 · 文字</time><h2>${safe(t)}</h2></article>`).join('')}<article class="entry"><time>16:24 · 随手记</time><button class="read" data-action="detail"><h2>路过花店，带了一束洋桔梗</h2><p>奶白色的花瓣，像今天傍晚的云。<br>放在书桌边，心情也变得轻了一点。</p></button><div class="tags"><span># 生活小事</span><span># 喜欢的瞬间</span></div></article><article class="entry"><time>12:08 · 原音</time><h2>给周末留一个小计划</h2>${audio()}</article><div class="composer"><button data-action="write">${state.draft?safe(state.draft):'这一刻，想记下什么？'}</button><div class="composer-foot"><div class="composer-tools"><button data-action="attach" aria-label="添加照片">${icon('image')}</button><button data-action="audio" aria-label="原音">${icon('mic')}</button></div><span class="soft">${icon('lock-keyhole')} 仅本机</span><button data-action="write" aria-label="展开编辑">${icon('arrow-up-right')}</button></div></div>`:page==='memories'?`${intro('回忆','你认真生活过的痕迹，都在这里。','YOUR LITTLE ARCHIVE')}<div class="search">${icon('search')}<input aria-label="搜索回忆" placeholder="找一句话、一件小事…"><button data-action="filters" aria-label="筛选">${icon('sliders-horizontal')}</button></div><div class="filterline"><button class="selected" data-filter="全部">全部</button><button data-filter="收藏">收藏</button><button data-filter="图片">图片</button><button data-filter="原音">原音</button><button data-action="more" aria-label="更多回忆工具">${icon('ellipsis')}</button></div><div class="month">NOVEMBER · 2026</div><div class="memory" data-kind="收藏"><div class="date">04<small>WED</small></div><div class="copy"><button data-action="detail" style="text-align:left;padding:0;min-height:0"><h2>路过花店，带了一束洋桔梗</h2><p>奶白色的花瓣，像今天傍晚的云。</p></button><div class="meta">16:24　·　生活小事</div></div></div><div class="memory" data-kind="原音"><div class="date">04<small>WED</small></div><div class="copy"><h2>给周末留一个小计划</h2><p>原始录音 · 00:12</p><div class="meta">12:08　·　未转写</div></div></div><div class="memory" data-kind="收藏"><div class="date">02<small>MON</small></div><div class="copy"><h2>原来慢一点也没有关系</h2><p>今天读到的一句话，想留给以后的自己。</p><div class="meta">21:16　·　读书摘记</div></div></div><button class="quiet-link" data-action="ask">${icon('sparkles')}从记忆里找一个答案${icon('arrow-right')}</button>`:`${intro('一件一件，慢慢来。','把重要的事，留在刚好的时间。','WEDNESDAY, NOV 04')}<div class="week">${['一','二','三','四','五','六','日'].map((x,i)=>`<div class="day ${i===2?'current':''}"><small>${x}</small>${i+2}</div>`).join('')}</div><div class="section-line"><h2>今天</h2><span>${state.done?1:2} 件待办</span></div><div class="task ${state.done?'done':''}"><button class="check" data-action="check" aria-label="${state.done?'撤销完成':'完成整理旅行照片'}" aria-pressed="${state.done}">${icon('check')}</button><div><p class="title">整理旅行照片</p><p class="soft">今天 19:00 · 已安排提醒</p></div><span class="tail">${icon('bell')}</span></div><div class="task"><button class="check" data-action="task-detail" aria-label="查看读完书的详情">${icon('check')}</button><div><p class="title">读完手边的那本书</p><p class="soft">今天 · 未设置提醒</p></div></div><div class="section-line" style="margin-top:28px"><h2>接下来</h2><span>周末</span></div><div class="task"><button class="check" data-action="task-detail" aria-label="查看散步计划">${icon('check')}</button><div><p class="title">去公园走走</p><p class="soft">11 月 07 日 · 仅日期</p></div></div><div class="suggestion"><span>有一条待确认草稿</span><button data-action="proposal" aria-label="查看待确认草稿">${icon('arrow-up-right')}</button></div><button class="add-task" data-action="new-task">${icon('plus')}添加一件事</button>`;main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');root.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});icons()}
function stop(){clearInterval(tick);tick=null;playing=false;seconds=0}function close(){sheet.classList.remove('open');shade.classList.remove('open');sheet.inert=true;lastFocus?.focus()}function modal(title,body,action=''){lastFocus=document.activeElement;sheet.innerHTML=`<div class="handle"></div><div class="sheethead"><button data-action="close" aria-label="关闭">${icon('x')}</button><h2>${title}</h2>${action||'<span style="width:44px"></span>'}</div>${body}`;sheet.inert=false;shade.classList.add('open');sheet.classList.add('open');icons();setTimeout(()=>sheet.querySelector('textarea,input,button')?.focus(),100)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.filter){root.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));root.querySelectorAll('.memory').forEach(x=>x.hidden=b.dataset.filter!=='全部'&&x.dataset.kind!==b.dataset.filter);return}switch(b.dataset.action){case'write':modal('记下此刻',`<div class="soft">11 月 04 日　·　仅本机</div><textarea aria-label="记录正文" placeholder="不必组织语言，写下就好。">${safe(state.draft)}</textarea><div class="composer-foot"><button data-action="attach">${icon('image')}</button><span class="soft">草稿为本次演示暂存</span><button data-action="audio">${icon('mic')}</button></div>`,`<button class="solid" data-action="save">记好</button>`);break;case'save':{const t=sheet.querySelector('textarea')?.value.trim();if(!t){toast('先写下一点内容吧');return}state.added.unshift(t);state.draft='';b.textContent='记好了';setTimeout(()=>{close();page='now';render();toast('已加入演示记录')},240);break}case'close':close();break;case'check':state.done=!state.done;b.closest('.task').classList.toggle('done',state.done);b.setAttribute('aria-pressed',String(state.done));toast(state.done?'完成了一件小事 · 可再点撤销':'已恢复为待办');break;case'play':{playing=!playing;b.innerHTML=icon(playing?'pause':'play');b.setAttribute('aria-label',playing?'暂停播放状态演示':'演示播放状态');icons();if(!playing){clearInterval(tick);break}tick=setInterval(()=>{seconds++;root.querySelector('.audio-row .time').textContent=`0:${String(seconds).padStart(2,'0')} / 0:12`;root.querySelectorAll('.wave b').forEach((x,i)=>x.classList.toggle('lit',i<seconds/12*30));if(seconds===12){stop();b.innerHTML=icon('play');icons()}},1000);break}case'detail':modal('原记录',`<div class="eyebrow">11 月 04 日　16:24</div><h1 style="font-size:23px">路过花店，带了一束洋桔梗</h1><div class="detail-body">奶白色的花瓣，像今天傍晚的云。<br><br>放在书桌边，心情也变得轻了一点。<br>想把这样的小事，慢慢记下来。</div><div class="tags"><span># 生活小事</span><span># 喜欢的瞬间</span></div><div class="options"><button data-action="favorite">${icon('bookmark')} 收藏</button><button data-action="write">${icon('pencil')} 编辑</button></div>`);break;case'filters':modal('筛选回忆','<p class="soft">保留当前搜索，只缩小查找范围。</p><div class="settings-row">时间范围<span>全部时间</span></div><div class="settings-row">人物<span>不限</span></div><div class="settings-row">标签<span>生活小事</span></div><div class="options"><button data-action="close">重置</button><button class="solid" data-action="close">查看结果</button></div>');break;case'settings':modal('设置','<div class="eyebrow">记录与隐私</div><div class="settings-row">默认处理范围<span>仅本机</span></div><div class="settings-row">应用锁<span>未开启</span></div><div class="settings-row">备份与恢复<span>查看 ›</span></div><div class="settings-row">模型连接<span>未连接 ›</span></div><div class="eyebrow" style="margin-top:25px">外观与体验</div><button class="settings-row" data-action="reduce" style="width:100%">减少动态效果<span>'+ (state.reduce?'已开启':'未开启')+'</span></button><div class="settings-row">陪伴伙伴<span>已显示</span></div>');break;case'reduce':state.reduce=!state.reduce;phone.classList.toggle('reduce',state.reduce);b.querySelector('span').textContent=state.reduce?'已开启':'未开启';break;case'new-task':modal('添加待办','<textarea aria-label="待办标题" placeholder="有一件什么事，想慢慢完成？"></textarea><div class="options"><button data-action="task-detail">今天</button><button data-action="task-detail">不提醒</button></div>','<button class="solid" data-action="close">完成</button>');break;case'more':modal('回忆工具','<div class="settings-row">统一查找<span>原文、转写与已采纳内容 ›</span></div><div class="settings-row">主动回顾<span>回看某一天 ›</span></div><div class="settings-row">资料管理<span>导出、备份与回收站 ›</span></div>');break;case'proposal':modal('待确认草稿','<p class="soft">确认前不会加入正式待办。</p><h2 style="margin:20px 0">把旅行照片做成一本小册子</h2><div class="settings-row">日期<span>未设置</span></div><div class="settings-row">提醒<span>不提醒</span></div><div class="options"><button data-action="close">暂时不做</button><button class="solid" data-action="close">确认加入</button></div>');break;case'companion':modal('在这里，歇一会儿。','<div style="padding:32px 0;color:var(--accent);text-align:center">'+icon('sprout')+'</div><p style="text-align:center;margin:10px 0 28px">今天已经很认真了。<br><span class="soft">留一点时间，给自己。</span></p><div class="options"><button data-action="close">回到记录</button></div>');break;case'audio':modal('原音','<p>原始声音，和文字一起留好。</p><p class="soft" style="margin:12px 0">本提案演示播放状态，不输出声音。</p><div class="options"><button data-action="close">导入原音</button></div>');break;case'ask':modal('从记忆里找','<textarea aria-label="问题" placeholder="想找回哪一件小事？"></textarea><p class="soft">选择来源与确认范围后，再发出问题。</p>');break;case'task-detail':modal('待办详情','<h2>读完手边的那本书</h2><div class="settings-row">日期<span>今天</span></div><div class="settings-row">提醒<span>未设置</span></div><div class="options"><button data-action="close">返回列表</button></div>');break;default:toast(b.dataset.action==='favorite'?'已在演示中收藏':'设计提案：此处进入系统附件选择')}});
root.addEventListener('input',e=>{if(e.target.getAttribute('aria-label')==='记录正文')state.draft=e.target.value;if(e.target.matches('.search input'))root.querySelectorAll('.memory').forEach(x=>x.hidden=!x.textContent.includes(e.target.value))});shade.addEventListener('click',close);root.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&sheet.classList.contains('open')){const a=[...sheet.querySelectorAll('button,input,textarea')].filter(x=>!x.disabled);const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--accent',state.accent);phone.classList.toggle('reduce',state.reduce)}});t.addColorPicker(state,'accent',{label:'强调色'});t.addToggle(state,'reduce',{label:'减少动态效果'})}
})();
</script>
</div>
