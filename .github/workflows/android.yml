  preview:
    if: ${{ !(github.event_name == 'push' && github.repository == 'T1doo/AIyou' && github.event.repository.private == false && github.ref == 'refs/heads/codex/d03-short-audio-design-20261020' && github.event.head_commit.message == '[ui-companion-probe] b438 actual button publication') }}
    name: Complete 430 Preview validation and original PNG evidence
    needs: [contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact workflow checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - name: Verify preview wrapper checksum
        run: |
          printf '%s  %s\n' \
            3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98 \
            gradle/wrapper/gradle-wrapper.jar | sha256sum --check -
      - name: Download the confirmed schema artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.contracts.outputs.schema_id }}
          path: build/ci-inputs/schema
          merge-multiple: true
      - name: Authenticate schema and required host evidence against this checkout
        id: transferred_inputs
        run: python3 scripts/verify-ci-stage-inputs.py --schema-dir build/ci-inputs/schema
      - name: Preserve the exact input transfer receipt
        if: always()
        uses: ./.github/actions/preserve-stage
        with:
          stage: schema-inputs
          outcome: ${{ steps.transferred_inputs.outcome }}
          name: d01-preview-inputs
          paths: build/ci-stage-evidence/transferred-inputs/result.json
      - name: Verify the renderer existing licensed SDK
        run: python3 scripts/check-sdk.py
      - name: Generate initial Preview render smoke references
        id: preview_generate
        if: success()
        env:
          AIYOU_CI_ANDROID_DAEMON: 'true'
        run: |
          scripts/gradle.sh :app:updateDebugScreenshotTest
          git diff --exit-code
      - name: Preserve initial Preview render smoke images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-preview-render-smoke
          path: |
            app/src/screenshotTestDebug/reference/
            app/build/outputs/screenshotTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Preview render smoke
        id: preview_validate
        if: always() && steps.preview_generate.outcome == 'success'
        env:
          AIYOU_CI_ANDROID_DAEMON: 'true'
        run: scripts/gradle.sh :app:validateDebugScreenshotTest
      - name: Require actual complete Preview render results
        id: preview_guard
        if: always() && steps.preview_validate.outcome == 'success'
        run: python3 scripts/verify-preview-results.py
      - name: Archive preview evidence before the next phase
        if: always()
        uses: ./.github/actions/preserve-stage
        with:
          stage: preview
          outcome: ${{ steps.preview_guard.outcome }}
          name: d01-preview-reports
          paths: |
            app/build/reports/screenshotTest/
            app/build/test-results/validateDebugScreenshotTest/
            app/build/reports/d01-preview-manifest.json
      - name: Package unchanged PNGs for attachment-sized visual review
        id: visual_packs
        if: always() && steps.preview_guard.outcome == 'success'
        run: python3 scripts/package-visual-previews.py
      - name: Preserve visual delivery manifest
        id: visual_index
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-index
          path: app/build/outputs/d01-visual-packs/INDEX.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload each unchanged bounded PNG ZIP independently
        if: always() && steps.visual_packs.outcome == 'success' && steps.visual_index.outcome == 'success'
        uses: ./.github/actions/upload-visual-packs

  companion-motion-diagnostic:
    name: DIAGNOSTIC ONLY - one Lulu method; not D01 acceptance
    if: ${{ github.event_name == 'push' && github.repository == 'T1doo/AIyou' && github.event.repository.private == false && github.ref == 'refs/heads/codex/d03-short-audio-design-20261020' && github.event.head_commit.message == '[ui-companion-probe] b438 actual button publication' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: aiyou-fixed-companion-motion-diagnostic
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - name: Require the fixed request and exact reviewed source
        run: python3 scripts/diagnose-companion-motion.py --admit
      - name: Verify unchanged wrapper and existing accepted SDK; no installation
        run: |
          printf '%s  %s\n' 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98 gradle/wrapper/gradle-wrapper.jar | sha256sum --check -
          python3 scripts/check-sdk.py
      - name: Capture all current schema guards
        id: schema_capture
        run: |
          for kind in manual-tag manual-task local-search permanent-erasure record-favorite local-candidate record-event-date manual-people model-configuration model-capability reminder-runtime; do
            python3 "scripts/verify-$kind-schema.py" --capture
          done
      - name: Run only the fixed actual companion method
        id: method
        env:
          AIYOU_CI_ANDROID_DAEMON: 'true'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 540s scripts/gradle.sh :app:testDebugUnitTest --tests 'com.t1doo.aiyou.CompanionSettingsPresentationTest.finiteInteractionMotionStopsOnReductionAndBackgroundWithoutAutomaticReplay' 2>&1 | tee build/companion-motion-diagnostic/gradle.log
      - name: Verify schema and tracked source even when the method fails
        id: schema_verify
        if: always() && steps.schema_capture.outcome == 'success' && steps.method.outcome != 'skipped'
        run: |
          for kind in manual-tag manual-task local-search permanent-erasure record-favorite local-candidate record-event-date manual-people model-configuration model-capability reminder-runtime; do
            python3 "scripts/verify-$kind-schema.py" --verify
          done
          git diff --exit-code
      - name: Record the actual single-case result; failures remain failures
        if: always()
        env:
          TARGET_OUTCOME: ${{ steps.method.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema_verify.outcome }}
        run: python3 scripts/diagnose-companion-motion.py --collect
      - name: Preserve raw diagnostic XML and log, not acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companion-motion-DIAGNOSTIC-ONLY
          path: |
            build/companion-motion-diagnostic/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/companion-motion/
          if-no-files-found: error
          retention-days: 14
