name: D01 Android and Preview checks

'on':
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d01:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - name: Verify wrapper checksum
        run: |
          printf '%s  %s\n' \
            3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98 \
            gradle/wrapper/gradle-wrapper.jar | sha256sum --check -
      - name: Run actual domain tests
        run: scripts/gradle.sh :core:domain:test
      - name: Run actual ViewModel queue failure regressions (host boundary)
        run: |
          scripts/gradle.sh --project-dir checks/record-queue test
          python3 scripts/verify-test-results.py --queue
      - name: Verify design contracts and generated tokens
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/generate-tokens.py --check
      - name: Test actual native diagnostic observer on host (no device claim)
        run: |
          scripts/gradle.sh --project-dir checks/native-trace test
          python3 scripts/verify-test-results.py --trace
      - name: Require nonempty passing tests
        run: python3 scripts/verify-test-results.py
      - name: Verify already installed and licensed SDK
        run: python3 scripts/check-sdk.py
      - name: Inspect existing device test environment without installation
        run: python3 scripts/inspect-device-test-environment.py
      - name: Verify Android dependency requirements
        run: scripts/gradle.sh :app:checkDebugAarMetadata :core:designsystem:checkDebugAarMetadata :core:data:checkDebugAarMetadata
      - name: Run actual component clipping and empty-state regression tests
        run: |
          scripts/gradle.sh :core:designsystem:testDebugUnitTest
          python3 scripts/verify-test-results.py --component
      - name: Build debug APK
        id: assemble
        run: |
          scripts/gradle.sh :app:assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Run actual Compose disabled-control and storage-wiring regressions (JVM simulation)
        run: |
          scripts/gradle.sh :app:testDebugUnitTest
          python3 scripts/verify-test-results.py --ui
      - name: Compile actual D02 native-storage instrumentation APK without claiming execution
        run: scripts/gradle.sh :core:data:assembleDebugAndroidTest
      - name: Verify actual license assets and APK ZIP alignment (native execution NOT RUN)
        run: python3 scripts/inspect-d02-apks.py
      - name: Run Android lint
        run: scripts/gradle.sh :app:lintDebug :core:designsystem:lintDebug :core:data:lintDebug
      - name: Generate initial Preview render smoke references
        id: preview_generate
        if: always() && steps.assemble.outcome == 'success'
        run: scripts/gradle.sh :app:updateDebugScreenshotTest
      - name: Validate Preview render smoke
        id: preview_validate
        if: always() && steps.preview_generate.outcome == 'success'
        run: scripts/gradle.sh :app:validateDebugScreenshotTest
      - name: Require actual complete Preview render results
        id: preview_guard
        if: always() && steps.preview_validate.outcome == 'success'
        run: python3 scripts/verify-preview-results.py
      - name: Package unchanged PNGs for attachment-sized visual review
        id: visual_packs
        if: always() && steps.preview_guard.outcome == 'success'
        run: python3 scripts/package-visual-previews.py
      - name: Preserve visual delivery manifest
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-index
          path: app/build/outputs/d01-visual-packs/INDEX.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 此刻
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-now
          path: app/build/outputs/d01-visual-packs/d01-visual-now.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 回忆
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-memories
          path: app/build/outputs/d01-visual-packs/d01-visual-memories.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 待办
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-tasks
          path: app/build/outputs/d01-visual-packs/d01-visual-tasks.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 组件
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-components
          path: app/build/outputs/d01-visual-packs/d01-visual-components.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 主导航
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-shell
          path: app/build/outputs/d01-visual-packs/d01-visual-shell.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve visual review ZIP - 完整长文本
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-visual-complete
          path: app/build/outputs/d01-visual-packs/d01-visual-complete.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Preserve complete white-blue phone pages for user review
        if: always() && steps.visual_packs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiyou-white-blue-pages
          path: app/build/outputs/d01-visual-packs/d01-visual-review.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Print complete lint findings
        if: always()
        run: |
          for module in app core/designsystem core/data; do
            report=$module/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            if [ -f "$report" ]; then
              cat "$report"
            else
              echo "Lint text report unavailable for $module; see preceding task result."
            fi
          done
      - name: Preserve exact generated D02 schema and lock bytes
        if: always()
        run: python3 scripts/export-d02-generated-state.py
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-reports
          path: |
            core/domain/build/test-results/test/
            core/domain/build/reports/tests/test/
            checks/record-queue/build/test-results/test/
            checks/record-queue/build/reports/tests/test/
            checks/record-queue/build/reports/attachment-process/
            checks/native-trace/build/test-results/test/
            checks/native-trace/build/reports/tests/test/
            core/designsystem/build/test-results/testDebugUnitTest/
            core/designsystem/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            core/designsystem/build/reports/lint-results-debug.*
            core/data/build/reports/lint-results-debug.*
            core/data/schemas/
            app/build/reports/d02-apk-audit.json
            app/build/outputs/apk/debug/*.zipalign.txt
            core/data/build/outputs/apk/androidTest/debug/*.zipalign.txt
            core/designsystem/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/screenshotTest/
            app/build/test-results/validateDebugScreenshotTest/
            app/build/reports/d01-preview-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve debug APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiyou-d01-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Preserve D02 instrumentation APK (compiled, execution NOT RUN)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d02-storage-test-apk
          path: core/data/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve initial Preview render smoke images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d01-preview-render-smoke
          path: |
            app/src/screenshotTestDebug/reference/
            app/build/outputs/screenshotTest-results/
          if-no-files-found: warn
          retention-days: 14
