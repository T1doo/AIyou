name: AIyou frontend day bounded review

# One exact parent-reviewed admission; this is not a reusable CI window.
# The pinned source SHA intentionally differs from the workflow execution SHA.
on:
  push:
    branches: ['frontend/day-20261102']
    paths: ['.github/workflows/frontend-day.yml']

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/frontend/day-20261102' && github.repository == 'T1doo/AIyou' && github.event.repository.private == false && github.run_number == 8 && github.run_attempt == 1 && github.event.head_commit.message == '[frontend-once-no-upload-audio-state] e33ff67afaedabeb34f8aa0f1e298b702e250a38' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIYOU_CI_ANDROID_DAEMON: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e33ff67afaedabeb34f8aa0f1e298b702e250a38
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - name: Verify public repository exact source SDK tokens and schema baseline
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == 'e33ff67afaedabeb34f8aa0f1e298b702e250a38'
          request = urllib.request.Request('https://api.github.com/repos/T1doo/AIyou', headers={'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              repository = json.load(response)
          assert repository['full_name'] == 'T1doo/AIyou' and repository['private'] is False and repository['visibility'] == 'public'
          with open(os.environ['GITHUB_ENV'], 'a') as runtime_env:
              runtime_env.write('GRADLE_USER_HOME=' + os.path.join(os.environ['RUNNER_TEMP'], 'aiyou-gradle-no-persist') + '\n')
              runtime_env.write('ANDROID_USER_HOME=' + os.path.join(os.environ['RUNNER_TEMP'], 'aiyou-android-user-no-persist') + '\n')
          print(json.dumps({'source_sha': source, 'workflow_execution_sha': os.environ['GITHUB_SHA'], 'run_number': os.environ['GITHUB_RUN_NUMBER'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'runner_label': 'ubuntu-24.04', 'publication': False, 'artifact_upload': False, 'remote_cache_write': False}))
          PY
          python3 scripts/check-sdk.py
          python3 scripts/generate-tokens.py --check
          python3 -m unittest scripts.tests.test_design_tokens -v
          git merge-base --is-ancestor 385463c5b168b0c66721a998e0c4b9f0b03c38f4 HEAD
          for script in scripts/verify-*-schema.py; do python3 "$script" --capture; done
      - name: Build and lint temporary native outputs only
        run: |
          timeout --signal=TERM --kill-after=10s 720s scripts/gradle.sh --no-build-cache --no-configuration-cache --no-scan :app:checkDebugAarMetadata :app:assembleDebug :core:domain:test :app:lintDebug
          for script in scripts/verify-*-schema.py; do python3 "$script" --verify; done
          python3 scripts/inspect-record-ai-permissions.py
      - name: Verify current draft attachments completion source and copy protocols on host
        run: timeout --signal=TERM --kill-after=10s 180s python3 scripts/jvm-gradle.py -p checks/ai-protocol --no-build-cache --no-configuration-cache --no-scan :remote-text:test --tests '*CaptureEditorSessionTest' --tests '*MixedCaptureControllerTest' --tests '*AudioFilterSqlTest' --tests '*CurrentImageGridControllerTest' --tests '*TaskUserReceiptSqlTest' --tests '*ManualTaskViewModelTest' --tests '*SourceTaskSqlTest' --tests '*TaskUndoFullBackupTest' --tests '*LocalSearchSqlTest' --tests '*SelectedQuestionConsentControllerTest' --tests '*ChatHistoryControllerTest' --tests '*OriginalAudioPresentationTest' --tests '*OriginalAudioControllerTest' --tests '*TaskReminderControllerTest' --max-workers=2
      - name: Verify preference migration and targeted composer regression
        run: timeout --signal=TERM --kill-after=10s 120s scripts/gradle.sh --no-build-cache --no-configuration-cache --no-scan :app:testDebugUnitTest --tests 'com.t1doo.aiyou.UiPreferencesTest' --tests 'com.t1doo.aiyou.MixedCapturePresentationTest.frontendDayFocusKeepsDraftAndFailedSaveRetriesTheSameRecord'
      - name: Report actual XML counts to ordinary job log only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          groups = {
              'domain': (Path('core/domain/build/test-results/test'), 78, 12),
              'host': (Path('checks/ai-protocol/remote-text/build/test-results/test'), 139, 14),
              'android_targeted': (Path('app/build/test-results/testDebugUnitTest'), 12, 2),
          }
          for group, (folder, expected_tests, expected_suites) in groups.items():
              suites = [ET.parse(p).getroot() for p in sorted(folder.glob('TEST-*.xml'))]
              totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
              print(json.dumps({'group': group, 'suites': len(suites), **totals}))
              assert len(suites) == expected_suites and totals['tests'] == expected_tests
              assert totals['failures'] == totals['errors'] == totals['skipped'] == 0
          PY
          git diff --exit-code -- app/src/main core/designsystem/src/main core/data/src/main core/model/src/main core/domain/src/main
# No Preview/baseline render, ZIP collection, artifact/cache action, package upload,
# release, deployment, credential/OIDC request, repeat matrix, automatic retry or always-upload step.
