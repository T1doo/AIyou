name: AIyou frontend day bounded review

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Explicit request; budget approval must also be restored in reviewed source
        type: boolean
        default: false
      approved_sha:
        description: Exact source SHA approved for one bounded run
        type: string
        required: true
      upload_minimal_evidence:
        description: Separate approval for at most 8 MiB and one day retention
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review:
    # FROZEN. Restoring this literal requires the parent's precise compute/storage approval.
    # No push/PR trigger, no default execution, no rerun admission.
    if: ${{ false && github.event_name == 'workflow_dispatch' && inputs.execute && inputs.approved_sha == github.sha && github.repository == 'T1doo/AIyou' && github.event.repository.private == false && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIYOU_CI_ANDROID_DAEMON: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.17+10'
          check-latest: false
      - name: Verify existing SDK, tokens and unchanged history baseline
        run: |
          python3 scripts/check-sdk.py
          python3 scripts/generate-tokens.py --check
          python3 -m unittest scripts.tests.test_design_tokens -v
          git merge-base --is-ancestor 385463c5b168b0c66721a998e0c4b9f0b03c38f4 HEAD
          for script in scripts/verify-*-schema.py; do python3 "$script" --capture; done
      - name: Build and lint actual native application
        run: |
          timeout --signal=TERM --kill-after=10s 720s scripts/gradle.sh :app:checkDebugAarMetadata :app:assembleDebug :core:domain:test :app:lintDebug
          for script in scripts/verify-*-schema.py; do python3 "$script" --verify; done
          python3 scripts/inspect-record-ai-permissions.py
      - name: Verify current draft attachment and completion protocols on host
        run: timeout --signal=TERM --kill-after=10s 120s python3 scripts/jvm-gradle.py -p checks/ai-protocol :remote-text:test --tests '*CaptureEditorSessionTest' --tests '*MixedCaptureControllerTest' --tests '*AudioFilterSqlTest' --tests '*CurrentImageGridControllerTest' --tests '*TaskUserReceiptSqlTest' --tests '*ManualTaskViewModelTest' --tests '*SourceTaskSqlTest' --tests '*TaskUndoFullBackupTest' --tests '*LocalSearchSqlTest' --max-workers=2
      - name: Verify display preference migration without history OOM group
        run: timeout --signal=TERM --kill-after=10s 120s scripts/gradle.sh :app:testDebugUnitTest --tests 'com.t1doo.aiyou.UiPreferencesTest' --tests 'com.t1doo.aiyou.MixedCapturePresentationTest.frontendDayFocusKeepsDraftAndFailedSaveRetriesTheSameRecord'
      - name: Render actual current UI with fixed synthetic data
        run: |
          timeout --signal=TERM --kill-after=10s 180s scripts/gradle.sh :app:updateDebugScreenshotTest --tests '*FrontendDay*'
          mkdir -p build/frontend-day/after
          python3 scripts/collect-frontend-evidence.py --previews-only
          git diff --exit-code -- app/src/main core/designsystem/src/main core/data/src/main
      - name: Collect only bounded current evidence
        if: always()
        run: python3 scripts/collect-frontend-evidence.py
      - name: Preserve separately approved minimal evidence
        if: ${{ always() && inputs.upload_minimal_evidence }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-day-minimal-evidence
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: build/frontend-day-minimal.zip
